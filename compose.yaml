name: codebuddy
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  volumes:
    - source:/data/source
  restart: unless-stopped
  stop_grace_period: 40s
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: codebuddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codebuddy}
      POSTGRES_DB: codebuddy
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codebuddy -d codebuddy"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/v1/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    <<: *backend
    command: ["celery", "-A", "app.tasks.worker:celery", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.worker:celery inspect ping --timeout 5 | grep pong"]
      interval: 30s
      timeout: 10s
      retries: 5
  scheduler:
    <<: *backend
    command: ["celery", "-A", "app.tasks.worker:celery", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:5001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine
    ports: ["8080:8080"]
    volumes: ["./infra/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      api: {condition: service_healthy}
      frontend: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres:
  redis:
  source:
