<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas width="3840" height="2160"></canvas><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
ctx.setTransform(2.4,0,0,2.4,0,0);
const TAU=Math.PI*2;
function project(x,y,z,phase){const c=Math.cos(phase),s=Math.sin(phase);const xx=x*c+z*s,zz=-x*s+z*c;const tilt=.32;const yy=y*Math.cos(tilt)-zz*Math.sin(tilt);const depth=y*Math.sin(tilt)+zz*Math.cos(tilt);const perspective=850/(850-depth);return {x:800+xx*perspective,y:255+yy*perspective,z:depth,scale:perspective};}
function draw(phase){ctx.fillStyle='#000';ctx.fillRect(0,0,1600,900);
 const glow=ctx.createRadialGradient(800,255,30,800,255,360);glow.addColorStop(0,'rgba(158,170,188,.025)');glow.addColorStop(.7,'rgba(110,124,145,.014)');glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.fillRect(300,0,1000,650);
 // Contours of a slowly turning source constellation. No text or external assets.
 for(let ring=0;ring<15;ring++){const lat=(ring/14-.5)*Math.PI*.91,rad=250*Math.cos(lat),yy=250*Math.sin(lat);ctx.beginPath();let depth=0;for(let step=0;step<=160;step++){const angle=step/160*TAU;const ripple=1+.025*Math.sin(angle*3+phase*2+ring*.24);const p=project(rad*Math.cos(angle)*ripple,yy,rad*Math.sin(angle)*ripple,phase);depth+=p.z;step?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);}ctx.strokeStyle=`rgba(178,190,208,${.065+.055*Math.cos(lat)})`;ctx.lineWidth=.65;ctx.stroke();}
 for(let meridian=0;meridian<12;meridian++){const angle=meridian/12*TAU;ctx.beginPath();for(let step=0;step<=100;step++){const lat=(step/100-.5)*Math.PI;const p=project(250*Math.cos(lat)*Math.cos(angle),250*Math.sin(lat),250*Math.cos(lat)*Math.sin(angle),phase);step?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);}ctx.strokeStyle='rgba(180,192,210,.06)';ctx.lineWidth=.6;ctx.stroke();}
 // Three brushed-silver orbital ribbons, with depth-aware highlights.
 for(let orbit=0;orbit<3;orbit++){const tilt=.35+orbit*.77,radius=294+orbit*19;for(let seg=0;seg<260;seg++){const a=seg/260*TAU,b=(seg+1)/260*TAU;function at(t){return project(radius*Math.cos(t),radius*Math.sin(t)*Math.sin(tilt)*.6,radius*Math.sin(t)*Math.cos(tilt),phase+orbit*.8);}const p=at(a),q=at(b),front=Math.max(0,(p.z+330)/660),light=(.5+.5*Math.cos(a-phase*2+orbit));ctx.strokeStyle=`rgba(218,224,235,${.025+front*.22+light*.15})`;ctx.lineWidth=.35+front*1.05+light*.8;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();}}
 // Stable nodes and gently traveling packets give the structure life.
 for(let i=0;i<62;i++){const y=1-2*(i+.5)/62,angle=i*2.399963229728653,rr=Math.sqrt(1-y*y);const p=project(250*rr*Math.cos(angle),250*y,250*rr*Math.sin(angle),phase);const brightness=.15+.65*Math.max(0,(p.z+250)/500);const size=(i%9===0?2.3:1.05)*p.scale;ctx.fillStyle=`rgba(231,236,245,${brightness})`;ctx.shadowColor='rgba(209,223,248,.5)';ctx.shadowBlur=i%9===0?9:0;ctx.beginPath();ctx.arc(p.x,p.y,size,0,TAU);ctx.fill();ctx.shadowBlur=0;}
 for(let i=0;i<5;i++){const angle=phase*(i%2?1:-1)+i*1.257;const p=project(297*Math.cos(angle),105*Math.sin(angle),270*Math.sin(angle),phase);const halo=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,13);halo.addColorStop(0,'rgba(240,245,255,.7)');halo.addColorStop(.12,'rgba(220,230,246,.35)');halo.addColorStop(1,'rgba(190,210,235,0)');ctx.fillStyle=halo;ctx.fillRect(p.x-13,p.y-13,26,26);}
 // Keep the lower hero clear for copy; the fade is baked into the original video.
 const fade=ctx.createLinearGradient(0,300,0,600);fade.addColorStop(0,'rgba(0,0,0,0)');fade.addColorStop(.65,'rgba(0,0,0,.7)');fade.addColorStop(1,'#000');ctx.fillStyle=fade;ctx.fillRect(0,300,1600,600);
}
window.draw=draw;draw(0);
window.record=async()=>{const stream=canvas.captureStream(24),chunks=[];const recorder=new MediaRecorder(stream,{mimeType:'video/mp4;codecs=avc1.640033',videoBitsPerSecond:18000000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};const finished=new Promise(resolve=>recorder.onstop=async()=>{const blob=new Blob(chunks,{type:'video/mp4'}),reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(blob);});recorder.start();const start=performance.now();await new Promise(resolve=>{function frame(now){const elapsed=(now-start)/1000;draw(elapsed/12*TAU);if(elapsed<12)requestAnimationFrame(frame);else resolve();}requestAnimationFrame(frame);});recorder.stop();stream.getTracks().forEach(t=>t.stop());return await finished;};
</script></body></html>
