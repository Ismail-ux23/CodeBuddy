name: CodeBuddy checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: {POSTGRES_USER: codebuddy, POSTGRES_PASSWORD: codebuddy, POSTGRES_DB: codebuddy_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U codebuddy" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql+psycopg://codebuddy:codebuddy@localhost:5432/codebuddy_test
      TEST_DATABASE_URL: postgresql+psycopg://codebuddy:codebuddy@localhost:5432/codebuddy_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/4
      APP_SECRET_KEY: ci-only-key-not-a-production-secret-12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.23', python-version: '3.12'}
      - run: cd backend && uv sync --frozen && uv run ruff check app tests --select F && uv run alembic upgrade head && uv run pytest -ra
      - run: cd frontend && npm ci && npm test && npm run lint && npm run build
      - run: python3 scripts/verify_demo.py
      - run: cd frontend && npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
